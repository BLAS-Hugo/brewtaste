workflows:
  pr-check:
    name: PR Check
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: develop
          include: true
          source: false
        - pattern: main
          include: true
          source: false
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test

  build-android:
    name: Build Android
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --dart-define=APPWRITE_ENDPOINT=$APPWRITE_ENDPOINT \
            --dart-define=APPWRITE_PROJECT_ID=$APPWRITE_PROJECT_ID \
            --dart-define=APPWRITE_DATABASE_ID=$APPWRITE_DATABASE_ID \
            --dart-define=SENTRY_DSN=$SENTRY_DSN
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=APPWRITE_ENDPOINT=$APPWRITE_ENDPOINT \
            --dart-define=APPWRITE_PROJECT_ID=$APPWRITE_PROJECT_ID \
            --dart-define=APPWRITE_DATABASE_ID=$APPWRITE_DATABASE_ID \
            --dart-define=SENTRY_DSN=$SENTRY_DSN
    artifacts:
      - build/ios/iphoneos/Runner.app
