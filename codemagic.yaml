workflows:
  pr-check:
    name: PR Check
    instance_type: linux_x2
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: develop
          include: true
          source: false
        - pattern: main
          include: true
          source: false
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test

  build-android:
    name: Build Android
    instance_type: linux_x2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: main
          include: true
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
        - pattern: main
          include: true
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate code
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
