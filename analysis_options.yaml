include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Disabled — single-method interfaces are common in clean architecture
    one_member_abstracts: false
    # Disabled — app code, not a public library
    public_member_api_docs: false
